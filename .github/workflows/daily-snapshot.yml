name: Daily snapshot

on:
  schedule:
    # 14:00 UTC ≈ 8:00 America/Chicago (CST) / 9:00 CDT
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Take snapshot
        run: ldw snapshot --preview 5
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily launch snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
