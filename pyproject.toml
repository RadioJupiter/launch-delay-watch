[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "launch-delay-watch"
version = "0.1.0"
description = "Open dataset and CLI tracking how far rocket launch NET dates slip, by vehicle, provider, and pad."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RadioJupiter" }]
keywords = ["space", "rockets", "spaceflight", "open-data", "dataset", "launches"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "pandas>=2.0",
  "requests>=2.31",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
ldw = "launch_delay_watch.cli:main"

[project.urls]
Homepage = "https://github.com/RadioJupiter/launch-delay-watch"
Repository = "https://github.com/RadioJupiter/launch-delay-watch"
Issues = "https://github.com/RadioJupiter/launch-delay-watch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
